<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Primeira Página com Bootstrap</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">

        <a class="navbar-brand fw-bold" href="#">Área do Aluno</a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarUsuario">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarUsuario">

            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link active" href="#">Dashboard</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#">Minhas aulas</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#">Atividades</a>
                </li>
            </ul>

            <div class="d-flex align-items-center gap-3">

                <a href="#" class="btn btn-outline-warning btn-sm">Login</a>

                <div class="dropdown">
                    <a href="#" class="d-flex align-items-center gap-2 text-white text-decoration-none dropdown-toggle" data-bs-toggle="dropdown" aria-expanded="false">
                        <img src="https://placehold.co/40x40" alt="Foto do usuário" class="user-photo">
                        <span class="d-none d-md-inline">Eugênio</span>
                    </a>

                    <ul class="dropdown-menu dropdown-menu-end">
                        <li><a class="dropdown-item" href="#">Meu perfil</a></li>
                        <li><a class="dropdown-item" href="#">Minhas turmas</a></li>
                        <li><a class="dropdown-item" href="#">Configurações</a></li>
                        <li><hr class="dropdown-divider"></li>
                        <li><a class="dropdown-item text-danger" href="#">Sair</a></li>
                    </ul>
                </div>
                <button class="btn btn-outline-light" type="button" data-bs-toggle="modal" data-bs-target="#modalBusca">
    🔍 Buscar
</button>


            </div>

        </div>

    </div>
</nav>


<div class="modal fade" id="modalBusca" tabindex="-1" aria-labelledby="modalBuscaLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">

            <div class="modal-header">
                <h1 class="modal-title fs-5" id="modalBuscaLabel">Buscar conteúdo</h1>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
            </div>

            <div class="modal-body">
                <form>
                    <label for="campoBusca" class="form-label">Digite o que deseja pesquisar</label>

                    <div class="input-group">
                        <input type="search" class="form-control" id="campoBusca" placeholder="Ex: Bootstrap, HTML, cursos...">
                        <button class="btn btn-primary" type="button">Pesquisar</button>
                    </div>
                </form>
            </div>

        </div>
    </div>
</div>



  <header class="hero text-center text-white py-5">
        <div class="container">
            <h1 class="display-4 fw-bold">Minha Primeira Página com Bootstrap</h1>
            <p class="lead">Aprendendo a criar páginas modernas, rápidas e responsivas.</p>
            <a href="#" class="btn btn-warning btn-sm">Começar agora</a>
            <a href="#" class="btn btn-success btn-sm">Novo Botão</a>
        </div>
    </header>

    <h1 class="text-center text-primary mt-5">Olá, Bootstrap!</h1>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
