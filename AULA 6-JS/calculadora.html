<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Simples</title>
    <link rel="stylesheet" href="css/stylecalculadora.css">
</head>

<body>

    <header class="topo">
        <h1>Calculadora Simples</h1>
        <p>Digite dois números e escolha uma operação</p>
    </header>

    <main class="container">
        <section class="calculadora">
            <label for="num1">Primeiro número:</label>
            <input type="number" id="num1" placeholder="Digite o primeiro número">

            <label for="num2">Segundo número:</label>
            <input type="number" id="num2" placeholder="Digite o segundo número">

            <div class="botoes">
                <button id="btnSomar">+</button>
                <button id="btnSubtrair">-</button>
                <button id="btnMultiplicar">*</button>
                <button id="btnDividir">/</button>
            </div>

            <p id="resultado"></p>
        </section>
    </main>

    <script src="js/scriptcaluladora.js"></script>
</body>

</html>
