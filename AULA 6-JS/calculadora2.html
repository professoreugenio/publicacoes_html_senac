<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Progressiva</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header class="topo">
        <h1>Calculadora Progressiva</h1>
        <p>Digite um número e escolha a operação desejada para ver o cálculo progressivo.</p>
    </header>

    <main class="container">
        <section class="calculadora">
            <label for="numero">Número:</label>
            <input type="number" id="numero" placeholder="Digite um número">

            <div class="botoes">
                <button id="btnSomar">Somar</button>
                <button id="btnSubtrair">Subtrair</button>
                <button id="btnMultiplicar">Multiplicar</button>
                <button id="btnDividir">Dividir</button>
            </div>

            <p id="resultado">Total: 0</p>
        </section>
    </main>

    <script src="js/scriptcalculadora2.js"></script>
</body>

</html>
