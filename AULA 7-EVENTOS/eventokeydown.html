<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eventos em JavaScript: addEventListener</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Navegação -->
    <nav>
        <ul>
            <li><a href="#hero">Início</a></li>
            <li><a href="#exemplo">Exemplo de Evento</a></li>
        </ul>
    </nav>

    <!-- Hero Section -->
    <section id="hero">
        <h1>Manipulando Eventos com addEventListener</h1>
        <p>Aprenda a capturar eventos de clique e pressionamento de tecla (Enter) para interagir com a página.</p>
    </section>

    <!-- Exemplo de Eventos -->
    <section id="exemplo">
        <h2>Exemplo de Interatividade</h2>
        <button id="btnClique">Clique aqui</button>
        <input type="text" id="campoTexto" placeholder="Pressione Enter para enviar">
        <p id="mensagem"></p>
    </section>

    <script src="js/script.js"></script>
</body>
</html>
