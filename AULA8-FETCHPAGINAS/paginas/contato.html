<section class="contato-section">
    <div class="contato-card">
        <div class="contato-header">
            <span class="contato-icon">💬</span>
            <h2>Página Contato</h2>
            <p>
                Esta área pode receber um formulário de contato.
            </p>
        </div>

        <form class="contato-form">
            <div class="form-group">
                <label for="nome">Nome:</label>
                <input type="text" id="nome" name="nome" placeholder="Digite seu nome">
            </div>

            <div class="form-group">
                <label for="mensagem">Mensagem:</label>
                <textarea id="mensagem" name="mensagem" rows="5" placeholder="Digite sua mensagem"></textarea>
            </div>

            <button type="button" class="btn-enviar">
                Enviar mensagem
            </button>
        </form>
    </div>
</section>
