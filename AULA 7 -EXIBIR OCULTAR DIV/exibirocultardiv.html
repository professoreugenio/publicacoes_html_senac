<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exibir e Ocultar DIV com FadeIn()</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <h1>Exibir e Ocultar uma DIV com FadeIn()</h1>
        <p>Clique no botão abaixo para exibir ou ocultar a área de conteúdo com o efeito de transição.</p>
    </header>

    <main>
        <button id="btnToggle">Mostrar/Esconder Conteúdo</button>

        <div id="conteudo" class="oculto">
            <h2>Conteúdo da DIV</h2>
            <p>Este conteúdo aparece e desaparece suavemente ao clicar no botão.</p>
        </div>
    </main>

    <script src="js/script.js"></script>
</body>
</html>
