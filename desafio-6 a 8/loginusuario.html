<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Usuário - UC7 Web</title>
  <link rel="stylesheet" href="assets/css/global.css">
</head>
<body>

  <header class="topo">
    <nav class="navbar">
      <a href="index.html" class="logo">UC7 Web</a>

      <div class="menu">
        <a href="index.html">Início</a>
        <a href="curso.html">Curso</a>
        <a href="portfolio.html">Portfólio</a>
        <a href="contato.html">Contato</a>
        <a href="loginusuario.html" class="ativo">Login</a>
      </div>
    </nav>
  </header>

  <main class="container">

    <section class="card">
      <h2>Form Login</h2>
      <p>Acesse sua área de usuário. Este formulário é apenas estrutural, sem back-end.</p>

      <form class="formulario" action="admin/index.html" method="get">
        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" placeholder="Digite seu e-mail" required>

        <label for="senha">Senha</label>
        <input type="password" id="senha" name="senha" placeholder="Digite sua senha" required>

        <button type="submit">Entrar</button>
      </form>
    </section>

  </main>

  <footer class="rodape">
    <p>Login - UC7 Desenvolvimento Web</p>
  </footer>

</body>
</html>
