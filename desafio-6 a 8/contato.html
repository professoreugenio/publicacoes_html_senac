<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contato - UC7 Web</title>
  <link rel="stylesheet" href="assets/css/global.css">
</head>
<body>

  <header class="topo">
    <nav class="navbar">
      <a href="index.html" class="logo">UC7 Web</a>

      <div class="menu">
        <a href="index.html">Início</a>
        <a href="curso.html">Curso</a>
        <a href="portfolio.html">Portfólio</a>
        <a href="contato.html" class="ativo">Contato</a>
        <a href="loginusuario.html">Login</a>
      </div>
    </nav>
  </header>

  <main class="container">

    <section class="card">
      <h2>Form Contato</h2>
      <p>Preencha o formulário abaixo para enviar uma mensagem.</p>

      <form class="formulario" action="#" method="post">
        <label for="nome">Nome completo</label>
        <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required>

        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" placeholder="Digite seu e-mail" required>

        <label for="telefone">Telefone</label>
        <input type="text" id="telefone" name="telefone" placeholder="Digite seu telefone">

        <label for="assunto">Assunto</label>
        <select id="assunto" name="assunto" required>
          <option value="">Selecione</option>
          <option value="curso">Informações sobre curso</option>
          <option value="suporte">Suporte</option>
          <option value="orcamento">Orçamento</option>
        </select>

        <label for="mensagem">Mensagem</label>
        <textarea id="mensagem" name="mensagem" rows="6" placeholder="Digite sua mensagem" required></textarea>

        <button type="submit">Enviar mensagem</button>
      </form>
    </section>

  </main>

  <footer class="rodape">
    <p>Contato - UC7 Desenvolvimento Web</p>
  </footer>

</body>
</html>
